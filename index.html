.ttl{line-height:1.3}
.ttl .wm{display:block;font-size:23px}
.wm{font-family:Orbitron,Cairo,sans-serif;font-weight:800;letter-spacing:.07em;background:linear-gradient(90deg,#ff9a1f,#ff6a1a,#19b5ff,#1f6bff,#19b5ff,#ff6a1a,#ff9a1f);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 4s linear infinite}
@keyframes flow{to{background-position:200% 0}}
.ttl small{display:block;font-weight:500;font-size:12px;color:var(--mut)}
.ctxbtn{margin-inline-start:auto;display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--line);padding:6px 14px;border-radius:999px;font-size:13px;color:#dbe6ff;max-width:55%}
.ctxbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctxbtn svg{width:16px;height:16px;flex:none}
nav{display:flex;background:var(--s1);border-top:1px solid var(--line);padding:6px 6px max(8px,env(safe-area-inset-bottom))}
.ni{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mut);font-size:11.5px;font-weight:600;padding:6px 0;line-height:1.4}
.ni svg{width:24px;height:24px}
.ni.on{color:#ffa24d}
.ni.on::before{content:"";position:absolute;top:-7px;width:30px;height:3px;border-radius:3px;background:var(--g)}
.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--s1);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
[hidden]{display:none!important}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:16px;text-align:start;display:flex;flex-direction:column;gap:3px}
.tile:active,.tile:hover{border-color:#3b82f6}
.tile i{width:42px;height:42px;border-radius:13px;background:var(--g);display:grid;place-items:center;margin-bottom:6px}
.tile i svg{width:22px;height:22px;color:#fff}
.tile b{font-size:16px}
.tile small{color:var(--mut);font-size:12.5px;line-height:1.6}
.back{color:var(--mut);font-size:14px;margin-bottom:4px}
#view{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;padding:12px 16px 28px}
.col{max-width:780px;margin:auto}
/* welcome */
.hello{padding:28px 0 8px;text-align:center}
.hello h1{font-size:30px;font-weight:800;line-height:1.5;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.hello p{color:var(--mut);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0 6px}
.hello+.chips{justify-content:center}
.chip{background:var(--s1);border:1px solid var(--line);padding:8px 16px;border-radius:999px;font-size:14px;font-weight:500;color:#dbe6ff;text-align:start;transition:.15s}
.chip:hover{border-color:#3b82f6;background:var(--s2)}
/* messages */
.m{margin:18px 0}
.m.u{display:flex;justify-content:flex-start}
.m.u .b{background:var(--g);padding:9px 18px;border-radius:20px;border-end-start-radius:6px;max-width:88%;font-weight:500;white-space:pre-wrap}
.m.a .out{padding-inline-end:6px}
.tools{display:flex;gap:8px;margin-top:6px}
.sm{font-size:13px;color:var(--mut);padding:2px 12px;border-radius:999px;border:1px solid var(--line)}
.sm:hover{color:#fff;border-color:#3b82f6}
/* markdown */
.out h2{font-size:19px;font-weight:800;margin:20px 0 4px;color:#8fb8ff}
.out h2:first-child{margin-top:0}
.out h3{font-size:16.5px;font-weight:700;margin:14px 0 2px;color:#ffb066}
.out p{margin:6px 0}
.out ul,.out ol{padding-inline-start:24px;margin:6px 0}
.out li{margin:5px 0}
.out li::marker{color:#ff8a1f}
.out strong{color:#fff;font-weight:700}
.out hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.out code{background:var(--s2);padding:1px 8px;border-radius:7px;font-size:14px}
.tw{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:8px 14px;text-align:start;border-bottom:1px solid var(--line)}
th{background:var(--s2);color:#8fb8ff}
tr:last-child td{border-bottom:0}
/* composer */
.comp{padding:8px 16px;padding-bottom:10px}
.bar{max-width:780px;margin:auto;display:flex;gap:10px;align-items:flex-end;background:var(--s1);border:1px solid var(--line);border-radius:26px;padding:8px 8px 8px 12px}
.bar:focus-within{border-color:#3b82f6}
.bar textarea{flex:1;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:16px;resize:none;max-height:140px;height:30px;padding:4px 8px;line-height:1.7}
.send{width:42px;height:42px;border-radius:50%;background:var(--g);display:grid;place-items:center;flex:none}
.send[disabled]{opacity:.4}
.send svg{width:20px;height:20px}
/* tool pages */
.card{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:20px}
.page h1{font-size:26px;font-weight:800;line-height:1.5}
.page .sub{color:var(--mut);margin-bottom:16px}
.fields{display:grid;gap:14px}
label{display:block;font-size:13.5px;font-weight:600;color:#c3d3f5;margin-bottom:3px}
input,select,textarea.f{width:100%;font:inherit;font-size:16px;color:var(--tx);background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
textarea.f{min-height:110px;resize:vertical}
input:focus,select:focus,textarea.f:focus{outline:0;border-color:#3b82f6}
select option{background:#132b4a}
.exs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.exs .chip{font-size:13px;padding:4px 14px}
.go{margin-top:18px;width:100%;background:var(--g);font-weight:800;padding:12px;border-radius:16px;font-size:17px}
.go[disabled]{opacity:.55}
.res{margin-top:18px}
.res .card{padding:18px 20px}
.rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--mut);font-size:13px}
.err{background:#2a1020;border:1px solid #6b1f3d;color:#ffb3c9;border-radius:16px;padding:12px 16px;margin:12px 0}
.dots{display:inline-flex;gap:5px;padding:8px 0}.dots i{width:8px;height:8px;border-radius:50%;background:#ff8a1f;animation:b 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-6px);opacity:.4}}
dialog{margin:auto;width:min(440px,92vw);background:var(--s1);color:var(--tx);border:1px solid var(--line);border-radius:24px;padding:22px}
dialog::backdrop{background:#000a}
dialog h3{font-size:19px;margin-bottom:12px}
#splash{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s,visibility .5s}
#splash.hide{opacity:0;visibility:hidden}
#splash img{width:150px;height:150px}
#splash .wm{font-size:40px;line-height:1.3}
#splash small{color:var(--mut);margin-top:-14px}
.ld{width:150px;height:5px;border-radius:5px;background:var(--s2);overflow:hidden}
.ld i{display:block;height:100%;width:0;background:var(--g);border-radius:5px;animation:fill 1.5s ease-out forwards}
@keyframes fill{to{width:100%}}
.gl{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--mut);flex:none}
.gl svg{width:22px;height:22px}
.gl[aria-pressed=true]{background:#1f6bff33;color:#7fd4ff}
.badge{font-size:12px;color:#7fd4ff;border:1px solid #1f6bff66;background:#1f6bff1a;padding:1px 10px;border-radius:999px;margin-inline-start:8px;font-weight:500}
.badge.fail{color:#ffb066;border-color:#ff8a1f66;background:#ff8a1f1a}
.sm0{font-size:13px;color:var(--mut);margin-inline-start:8px}
.up{display:block;border:1.5px dashed var(--line);border-radius:14px;padding:16px;text-align:center;color:var(--mut);cursor:pointer;font-weight:500;margin:0}
.up:hover{border-color:#3b82f6;color:#dbe6ff}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.th{position:relative;width:64px;height:64px}
.th img{width:100%;height:100%;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.th button{position:absolute;top:-6px;inset-inline-start:-6px;width:22px;height:22px;border-radius:50%;background:#ff8a1f;color:#fff;font-size:14px;line-height:22px}
.hrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer}
.hrow.on{border-color:#3b82f6}
.hrow b{flex:1;font-weight:600;font-size:14.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hrow small{color:var(--mut);font-size:12px;flex:none}
#hlist{max-height:55vh;overflow-y:auto;margin-bottom:12px}
@media(max-width:430px){.ctxbtn span{display:none}.ctxbtn{padding:0;width:38px;height:38px;justify-content:center}}
header{position:relative;z-index:5}
.ctxrow{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none;flex:none}
.ctxrow::-webkit-scrollbar{display:none}
.cx{flex:none;display:flex;align-items:center;gap:6px;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:13.5px;color:#dbe6ff}
.cx b{font-weight:600}.cx svg{width:14px;height:14px;color:var(--mut)}
.cx:hover,.sel:hover{border-color:#3b82f6}
.sel{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-size:16px;text-align:start}
.sel svg{width:18px;height:18px;color:var(--mut);flex:none}
#sheet{position:fixed;inset:0;z-index:90}
#sheet .bk{position:absolute;inset:0;background:#000b;backdrop-filter:blur(2px);animation:fade .2s}
#sheet .pn{position:absolute;bottom:0;left:0;right:0;margin:auto;max-width:560px;max-height:84dvh;overflow-y:auto;background:var(--s1);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:6px 18px max(18px,env(safe-area-inset-bottom));animation:up .25s ease-out}
.pn::before{content:"";display:block;width:42px;height:4px;border-radius:4px;background:var(--line);margin:6px auto 10px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.hd b{font-size:19px;font-weight:800}
.x{width:34px;height:34px;border-radius:50%;background:var(--s2);font-size:20px;line-height:1}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:start;font-size:16px;font-weight:500}
.opt.on{border-color:#3b82f6;background:#1f6bff22}
.opt span{flex:1}
.opt em{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none}
.opt.on em{border:6px solid #3b82f6}
.bd{font-style:normal;width:36px;height:36px;border-radius:10px;background:var(--g);display:grid;place-items:center;font-size:11.5px;font-weight:800;color:#fff;flex:none}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@keyframes fade{from{opacity:0}}
.m.a{display:flex;gap:10px;align-items:flex-start;animation:up .25s}
.m.u{animation:up .25s}
.av{width:32px;height:32px;border-radius:10px;overflow:hidden;flex:none;margin-top:2px}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.bub{flex:1;min-width:0;background:var(--s1);border:1px solid var(--line);border-radius:20px;border-start-start-radius:6px;padding:14px 16px}
.m.a .out{padding:0}
.srcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.src{font-size:12px;color:#9cc2ff;border:1px solid #1f6bff55;background:#1f6bff14;padding:2px 10px;border-radius:999px;text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{align-items:center;flex-wrap:wrap}
.chips.fl{margin-inline-start:42px}
.att{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--mut);flex:none}
.att svg{width:22px;height:22px}
.cthumbs{max-width:780px;margin:0 auto 8px;display:flex;gap:10px;flex-wrap:wrap}
.cthumbs:empty{display:none}
.uth{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.uth img{width:72px;height:72px;object-fit:cover;border-radius:10px}
.hello+.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hello+.chips .chip{border-radius:16px;padding:12px 14px;line-height:1.6;font-size:14px}
.up.big{padding:36px 16px;font-size:16px;background:var(--s2)}
.conn{margin:14px 0 4px}
.cn{display:flex;align-items:center;gap:8px;font-size:14px;color:#c3d3f5;margin:6px 0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mut);flex:none}
.dot.ok{background:#35d07f}.dot.off{background:#ff8a1f}
.hs{margin-bottom:10px}
.hg{font-size:12.5px;color:var(--mut);font-weight:700;margin:14px 2px 6px}
.hrow{display:flex;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:16px;margin-bottom:8px;background:var(--s2);cursor:pointer}
.hrow.on{border-color:#3b82f6}
.ht{flex:1;min-width:0}
.ht b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht small{display:block;color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht i{font-style:normal;color:#8fb8ff;font-size:12px}
.ytc{margin-bottom:14px}.ytc h3{font-size:15px;margin-bottom:6px}
.yr{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:1.6}
.yr:first-of-type{border-top:0}
.yr a{color:var(--tx);text-decoration:none;flex:1}
.yr small{color:#8fb8ff;flex:none}
.tb{display:flex;justify-content:space-between;gap:10px;padding:2px 16px 8px;flex:none}
.tbtn{display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:7px 14px;font-size:14px;font-weight:600;color:#dbe6ff}
.tbtn svg{width:18px;height:18px}
.tbtn:hover:not([disabled]){border-color:#3b82f6}
.tbtn[disabled]{opacity:.45;cursor:default}
.ctxrow.in{padding:0 0 14px;margin-top:-6px}
.segs{display:flex;gap:6px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.seg{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px;border-radius:10px;font-weight:700;font-size:14.5px;color:var(--mut)}
.seg.on{background:var(--s2);color:#fff;box-shadow:0 0 0 1px #3b82f6}
.team{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tm{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mut)}
.tm i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.tm.run{color:#dbe6ff;border-color:#3b82f6}.tm.run i{background:#3b82f6;animation:b 1s infinite}
.tm.ok{color:#c3d3f5}.tm.ok i{background:#35d07f}
.tm.fail i{background:#ff8a1f}
.mdl{direction:ltr;text-align:left;font-size:11.5px;color:var(--mut);word-break:break-all;margin-top:6px;line-height:1.6}
:root{--bg:#06172e;--s1:#06172e;--s2:#0a2147;--line:#16477f;--g2:linear-gradient(135deg,#00c0ff 0%,#ff5e62 62%,#ff9966 100%)}
body{background-color:#020b16;background-image:radial-gradient(circle at 50% 28%,rgba(10,51,102,.45) 0,transparent 60%),linear-gradient(135deg,rgba(10,43,82,.5) 0,rgba(5,24,51,.25) 45%,transparent 60%),linear-gradient(315deg,rgba(13,54,102,.45) 0,rgba(6,30,61,.2) 40%,transparent 60%),radial-gradient(#1e518a 1.2px,transparent 1.2px);background-size:100% 100%,100% 100%,100% 100%,28px 28px;background-position:0 0,0 0,0 0,14px 14px}
#splash{background:#020b16}
.card,.tc,.hc,.mt,.sumc,.ytb,.tbtn,.cx,.bub,.bar,.opt,.sel,.pn{background-color:var(--s1)}
.go,.send{background:var(--g2)}
.go.ghost{background:var(--s2);border:1px solid var(--line)}
/* nav */
nav{background:#06172e;border-top:1px solid var(--line);padding:8px 4px max(8px,env(safe-area-inset-bottom))}
.ni{--c:#fff;gap:3px;font-size:11px;font-weight:700;padding:4px 0}
.ni::before{display:none}
.ni.on::before{display:block;background:var(--c);top:-9px}
.av2{width:42px;height:42px;border-radius:14px;overflow:hidden;border:2px solid transparent;transition:.2s;opacity:.7}
.av2 img{width:100%;height:100%;object-fit:cover;display:block}
.ni.on{color:#fff}
.ni.on .av2{opacity:1;border-color:var(--c);box-shadow:0 0 16px color-mix(in srgb,var(--c) 55%,transparent);transform:translateY(-3px)}
/* page head */
.ph{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.phi{width:70px;height:70px;border-radius:20px;overflow:hidden;border:1.5px solid var(--c);flex:none;box-shadow:0 0 24px color-mix(in srgb,var(--c) 38%,transparent)}
.phi img{width:100%;height:100%;object-fit:cover;display:block}
.ph h1{font-size:21px;line-height:1.45}
.ph p{color:var(--mut);font-size:13.5px;line-height:1.7}
.mut{color:var(--mut);font-size:12.5px}
/* welcome */
.tstrip{display:flex;justify-content:center;gap:10px;margin:18px 0 4px;flex-wrap:wrap}
.tav{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:#cfe0ff}
.tav img{width:54px;height:54px;border-radius:16px;border:1.5px solid var(--c);object-fit:cover}
.tlink{display:block;margin:8px auto 14px;color:#8fb8ff;font-size:13px;text-decoration:underline}
.chips.sug{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.chips.sug .chip{border-radius:16px;padding:12px 14px;line-height:1.6;font-size:14px;background:var(--s1)}
.hello{padding:18px 0 4px}
/* team chips */
.team{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 2px}
.tm{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--mut);background:var(--s2)}
.tm img{width:22px;height:22px;border-radius:50%;object-fit:cover;filter:grayscale(.8);opacity:.6}
.tm i{display:none}
.tm.run{border-color:var(--c);color:#fff}.tm.run img{filter:none;opacity:1;animation:pulse 1s infinite}
.tm.ok{color:#cfe0ff;border-color:color-mix(in srgb,var(--c) 55%,var(--line))}.tm.ok img{filter:none;opacity:1}
.tm.fail{opacity:.55}
.tm em{font-style:normal;color:#8fb8ff;font-size:11px}
@keyframes pulse{50%{transform:scale(1.18)}}
.iss{margin-top:10px;font-size:13px}.iss summary{color:#ffb066;cursor:pointer}.iss ul{padding-inline-start:20px;margin:6px 0;color:#c3d3f5}
/* sheets extras */
.lead{color:#c3d3f5;font-size:14px;line-height:1.8;margin-bottom:12px}
.tlist{display:grid;gap:10px;margin-bottom:14px}
.trow{display:flex;gap:12px;align-items:center;text-align:start;background:var(--s2);border:1px solid var(--line);border-radius:18px;padding:10px;width:100%}
.trow img{width:58px;height:58px;border-radius:16px;border:1.5px solid var(--c);flex:none;object-fit:cover}
.trow b{font-size:15px}.trow small{color:var(--mut);font-weight:500;font-size:12px;margin-inline-start:6px}
.trow p{color:#c3d3f5;font-size:13px;line-height:1.6;margin:2px 0 0}
.chs{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.chs img{width:128px;height:128px;border-radius:30px;border:2px solid var(--c);box-shadow:0 0 34px color-mix(in srgb,var(--c) 40%,transparent);object-fit:cover}
.chs b{font-size:24px;font-weight:800}.chs .rl{color:var(--c);font-weight:700}
.chs p{color:#c3d3f5;font-size:14px;line-height:1.8;margin:0}.chs .tw{color:var(--mut);font-size:13px}
.chs .go{margin-top:12px}
/* generic pieces */
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--s2);font-size:13.5px;color:#cfe0ff}

const SYSTEM=`أنت Viral: مستشار سوشيال ميديا عربي خبير، بتكلّم المستخدم زي صديق خبير مش زي تقرير. تفكر كمحلل بيانات قبل ما تكتب.
أهم قاعدة: افهم المطلوب بالظبط قبل ما ترد.
- المستخدم ممكن يذكر مجاله أو موضوعه في رسالته أو في رسايل قبلها (مثلاً "بعمل محتوى روبلكس" أو "ترند على روبلكس"). ده أهم من أي سياق تاني: التزم بيه حرفياً وخلّي كل الرد عنه بأسماء وتفاصيل من الموضوع نفسه. ممنوع كلام عام عن "السوشيال ميديا" أو عن مجال تاني.
- حدد نوع الطلب ورد عليه مباشرة بدون مقدمات:
  * ترندات: 4 إلى 6 ترندات محددة بالاسم من البحث الحي في مجاله (الاسم، ليه شغال دلوقتي، إزاي يستغله في سطر). ولو ملقتش ترندات حقيقية في مجاله قل كده بوضوح بدل ما تحكي كلام عام.
  * هوك أو سكريبت: اكتب النص الجاهز بالمنطوق فوراً، مش شرح.
  * مشكلة في الأرقام (ريتش، مشاهدات، تفاعل): شخّص من الأرقام واذكر السبب الأرجح والحل. لو الأرقام ناقصة اسأل عن رقم أو اتنين بس.
  * سؤال معلومات أو إعدادات: جواب مباشر، وابحث لو المعلومة بتتغير.
- ممنوع تبدأ ردك بكلمة "الحكم" أو أي عنوان ثابت. ابدأ بالإجابة نفسها.
- لو الطلب مش واضح فعلاً، اسأل سؤال واحد قصير بدل ما تخمّن كلام عام.
- أي رقم أو ترند أو اسم لازم يكون من البحث أو معروف ومؤكد. ممنوع تخترع. أي رقم من عندك اكتب جنبه (تقدير). ولو ما لقيتش قل "ما لقيتش". انسب المعلومة لاسم مصدرها داخل الجملة ولا تكتب روابط.
- لما يكون في أرقام: اربط التشخيص بيها. المحتوى بيتعطل في واحدة من أربع مراحل: محدش بيوقف (تغليف: هوك، صورة مصغرة، عنوان)، بيوقف ويسيب بسرعة (احتفاظ)، بيكمل ومبيتفاعلش (قيمة أو دعوة للتفاعل)، أو أداء كويس ومبيتوزعش (توقيت، جمهور، هشتجات).
- إشارات المنصات (قواعد عامة مش ضمانات): تيك توك: نسبة المشاهدة الكاملة وإعادة المشاهدة والمشاركات، والخوارزمية بتجرب الفيديو على دفعة صغيرة وتوسّع لو الأداء كويس. ريلز: الإرسال والحفظ أهم من اللايك وأول ثانيتين حاسمتين. شورتس: نسبة "شاف" مقابل "تخطّى". فيسبوك: التفاعل الحقيقي والمشاهدة أكتر من دقيقة. إكس: الردود والتفاعل المبكر في أول ساعة، والروابط الخارجية بتقلل الوصول.
- الترند: صنّفه (صوت، قالب، لعبة، موضوع، حدث) وحدد مرحلته (بداية، ذروة، تشبّع). الترند البعيد عن نيش المستخدم بيجيب جمهور غلط، فلا تقترحه.
خبرة يوتيوب (تصرّف كخبير يوتيوب ستوديو):
- تحليلات الستوديو: نظرة عامة، الوصول (مرات الظهور، نسبة النقر CTR، مصادر الزيارات)، التفاعل (وقت المشاهدة، متوسط مدة المشاهدة، منحنى الاحتفاظ)، الجمهور (العائدون والجدد، وقت تواجد الجمهور)، الإيرادات. لو سُئلت عن مكان إعداد أو زر معيّن ابحث وتأكد من الواجهة الحالية قبل ما تقول المسار، لأنها بتتغير، واشرحه خطوة خطوة.
- النشر الصح: عنوان واضح بالكلمة المفتاحية في أوله (حوالي 60 حرف)، صورة مصغرة بنص قصير وعنصر واحد واضح، أول سطرين في الوصف يلخصوا الفيديو، فصول، قوائم تشغيل، شاشة نهاية وبطاقات، تعليق مثبّت، اللغة والتصنيف، إعداد "للأطفال" وإفصاح المحتوى المعدّل بالذكاء الاصطناعي، جدولة النشر لوقت نشاط الجمهور، واختبار الصور المصغرة (Test and compare) لو متاح.

- المشاكل الشائعة: فيديو واقف على صفر أو "قيد المعالجة" أو الجودة العالية لسه بتتعالج (مؤقت)، فيديو مش بيظهر (راجع الظهور عام أو غير مدرج أو خاص، والقيود، والمطالبات)، نزول مرات الظهور أو CTR، حقوق النشر وإرشادات المجتمع، أيقونة الدولار الأصفر (تقييد الإعلانات)، تعطّل الرفع (الصيغة، الحجم، تفعيل الميزات المتقدمة برقم الهاتف للفيديوهات الأطول من 15 دقيقة)، وشروط برنامج الشركاء (تحقق منها بالبحث لأنها بتتحدث).

- الخوارزمية بتجرّب الفيديو على دفعة صغيرة وتوسّع حسب الإكمال وإعادة المشاهدة والمشاركات. أول ثانية هي الهوك، والفيديو القصير المكتمل أقوى من الطويل المتروك.

    tm["n"+k]=ok+"/"+ids.length;mark(k,ok?"ok":"fail")};

    await Promise.allSettled([within(groqStream(um,()=>{},ROLE_X2,undefined,true),15000).then(r=>{ok++;pool.push(r.text)}).catch(()=>{}),within(pollStream(um,()=>{},ROLE_X2),15000).then(r=>{ok++;pool.push(r.text)}).catch(()=>{})]);

async function judge(body){
  const um=[{role:"user",content:body}];
  const r=await race([{id:"g",delay:0,run:(t,sg)=>gStream(um,()=>{},JUDGE,{think:0,search:false,signal:sg})},{id:"q",delay:1500,run:(t,sg)=>groqStream(um,()=>{},JUDGE,sg,true)}],()=>{},{late:true,timeout:15000});
  return r.text;
}
async function compare(messages,d,ep,pool,mark,tm,onFix){
  const q=messages[messages.length-1];
  await Promise.race([ep,new Promise(r=>setTimeout(r,12000))]);
  const ex=pool.slice(0,8);tm.n=ex.length+2;
  let issues=[],need=false;
  if(ex.length){
    mark("e","run");
    try{
      const body=`${ctx()}\nسؤال المستخدم:\n${q.content}\n\nالمسودة:\n${lim(d.text,5000)}\n\nآراء خبراء مستقلين:\n${ex.map((t,i)=>`[خبير ${i+1}] ${lim(t,900)}`).join("\n")}`;
      const t=await judge(body),j=JSON.parse(t.slice(t.indexOf("{"),t.lastIndexOf("}")+1));
      issues=(j.issues||[]).map(String).filter(Boolean).slice(0,8);need=j.verdict==="fix"&&issues.length>0;
    }catch(e){}
  }
  let text=d.text,fixed=false,sources=d.sources||[];
  if(need){
    mark("w","run");
    try{
      const ed=messages.map((m,i)=>i===messages.length-1?{role:m.role,content:`${q.content}\n\n[مسودة فيها أخطاء، لا تذكرها]\n${lim(d.text,5000)}\n\n[ملاحظات المراجعين]\n- ${issues.join("\n- ")}\n\n[آراء الخبراء]\n${ex.slice(0,4).map((t,i)=>`[خبير ${i+1}] ${lim(t,700)}`).join("\n")}`,imgs:m.imgs}:m);
      const yt=ytSnap(),sys=SYSTEM+"\n\n"+ctx()+(yt?"\n\n"+yt:"")+GADD+ROLE_FIX,fx=onFix||(()=>{});
      let fin;try{fin=await within(gStream(ed,fx,sys,{think:0}),40000)}catch(e){fin=await within(groqStream(ed.map(m=>({role:m.role,content:m.content})),fx,sys),40000)}
      if(fin.text.trim()){text=fin.text;fixed=true;for(const x of fin.sources||[])if(!sources.some(z=>z.uri===x.uri))sources=[...sources,x]}
      mark("w",fixed?"ok":"fail");
    }catch(e){mark("w","fail")}
  }
  mark("e","ok");
  return{text,fixed,issues,tm,sources};
}
async function ask(messages,onText,onStat,fast,onFix){
  const lm=messages[messages.length-1];
  const simple=fast||((lm.content||"").length<25&&!(lm.imgs&&lm.imgs.length));
  const tm={},mark=(k,v)=>{tm[k]=v;if(onStat)onStat(k,v)},pool=[];
  let ep=Promise.resolve();
  if(!simple){["r","x","c","s"].forEach(k=>mark(k,"run"));ep=startExperts(messages,mark,tm,pool).catch(()=>{})}
  let d;
  try{d=await stream(messages,onText)}catch(e){for(const k of Object.keys(tm))if(tm[k]==="run")tm[k]="fail";throw e}
  if(simple)return d;
  mark("r","ok");d.tm=tm;
  d.verify=within(compare(messages,d,ep,pool,mark,tm,onFix),90000).catch(()=>{for(const k of Object.keys(tm))if(tm[k]==="run")tm[k]="fail";tm.e="ok";return{text:d.text,fixed:false,issues:[],tm,sources:d.sources}});
  return d;
}

  if(t=T("[data-trf]")){trFilter=t.dataset.trf;drawTrend();return}
  if(t=T("[data-tr2s]")){const x=TR.list[+t.dataset.tr2s];goScript((x.name||"")+(x.idea?" - "+x.idea:""));return}
  if(t=T("[data-tr2c]")){const x=TR.list[+t.dataset.tr2c];tab="chat";render();send(`حلّل لي ترند "${x.name}" وإزاي أستغله في مجالي؟`);return}
  if(t=T("[data-trcp]")){const x=TR.list[+t.dataset.trcp];copyTo(`${x.name}\n${x.why||""}\nالفكرة: ${x.idea||""}\nالهوك: ${x.hook||""}`,t);return}
  if(t=T("[data-style]")){SC.style=t.dataset.style;drawScOpts();return}
  if(t=T("[data-mode]")){SC.mode=t.dataset.mode;drawScOpts();return}
  if(t=T("[data-sccp]")){copyTo(SC.res.data.hooks[+t.dataset.sccp].line,t);return}
  if(t=T("[data-sc2s]")){const h=SC.res.data.hooks[+t.dataset.sc2s];SC.mode="s30";SC.topic=SC.topic+" (الهوك المختار: "+h.line+")";const a=$("#sc_topic");if(a)a.value=SC.topic;drawScOpts();runScript();return}
  if(t=T("[data-scall]")){copyTo(scriptText(SC.res.data),t);return}
  if(t=T("[data-frplan]")){let d={};try{d=JSON.parse(st.get("sm_plan")||"{}")}catch(x){}d[t.dataset.frplan]=!d[t.dataset.frplan];st.set("sm_plan",JSON.stringify(d));drawFr();return}
  if(t=T("[data-fr2s]")){const x=FR.res.ideas[+t.dataset.fr2s];goScript((x.hook||"")+" - "+(x.idea||""));return}
  if(T("[data-frchat]")){const d=FR.res;tab="chat";render();send("ناقشني في نتيجة تحليل حسابي: التقييم "+d.score+"/100. "+(d.summary||"")+" أهم المشاكل: "+(d.problems||[]).map(p=>p.title).join("، ")+". إيه أول حاجة أبدأ بيها؟");return}
  if(T("[data-frnew]")){FR.res=null;imgs=[];try{st.set("sm_fr","")}catch(x){}render();return}
  if(T("#menubtn")){openSide();return}
  if(T("[data-sclose]")){closeSide();return}
  if(T("[data-sbnew]")){if(!busy){hist=[];chatId=null;tab="chat";closeSide();render()}return}
  if(T("[data-sbhist]")){closeSide();openHist();return}
  if(T("[data-logout]")){logout();return}
  if(T("[data-login]")){doLogin(false);return}
  if(T("[data-guest]")){doLogin(true);return}
  if(t=T("[data-tmode]")){TM=t.dataset.tmode;trFilter="الكل";trendPage($("#view"));return}
  if(t=T("[data-tqex]")){const i=$("#tq_in");if(i)i.value=t.dataset.tqex;runTopic(t.dataset.tqex);return}
  if(T("[data-tqgo]")){const i=$("#tq_in");runTopic(i?i.value:"");return}
  if(t=T("[data-fm]")){FM=t.dataset.fm;imgs=[];render();return}
  if(t=T("[data-tab]")){if(t.dataset.tab!==tab)imgs=[];tab=t.dataset.tab;render();return}
  if(t=T("[data-copy]")){copyTo(hist[+t.dataset.copy].content,t);return}
  if(t=T("[data-fill]")){const el=$("#"+t.dataset.fill);el.value=t.dataset.p;el.focus();return}
  if(t=T(".chip[data-s]")){if(t.dataset.s==="1")send(t.dataset.p,t.dataset.f==="1");else{const q=$("#q");q.value=t.dataset.p;q.focus();q.oninput()}}
});
["platform","niche","country","tsize"].forEach(id=>{
  const el=$("#"+id);el.value=st.get("sm_"+id)||(id==="platform"?"تيك توك":id==="country"?"مصر":id==="tsize"?TSIZES[1]:"");
  if(id==="platform"&&!PLATS.some(p=>p[0]===el.value))el.value="تيك توك";
  if(id==="tsize"&&!TSIZES.includes(el.value))el.value=TSIZES[1];
  el.addEventListener("change",()=>{st.set("sm_"+id,el.value);ctxLabel()});
});
LOGO=document.querySelector(".logo").src;
const fav=document.createElement("link");fav.rel="icon";fav.href=LOGO;document.head.appendChild(fav);
try{if(window.addEventListener)window.addEventListener("unhandledrejection",e=>e.preventDefault())}catch(e){}
ctxLabel();render();ytLive();orPanel(8);

$("#lg_logo").src=LOGO;if(!getUser())showLogin();else regUser();
$("#spl").src=LOGO;
setTimeout(()=>{$("#splash").classList.add("hide");setTimeout(()=>$("#splash").remove(),600);},1700);
</script>
